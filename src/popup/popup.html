<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Better Canvas</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="bc-pop-header">
      <span class="bc-pop-logo">BC</span>
      <h1>Better Canvas</h1>
    </header>

    <div id="site-status" class="bc-site"></div>

    <section class="bc-section">
      <label class="bc-toggle">
        <span>Enable Better Canvas</span>
        <input type="checkbox" id="enabled" />
      </label>

      <label class="bc-row">
        <span>Dark mode</span>
        <select id="darkMode">
          <option value="off">Off</option>
          <option value="on">On</option>
          <option value="auto">Auto (system)</option>
          <option value="scheduled">Scheduled</option>
        </select>
      </label>

      <label class="bc-toggle">
        <span>Dashboard customization</span>
        <input type="checkbox" id="dashEnabled" />
      </label>
    </section>

    <button id="open-options" class="bc-btn bc-btn--primary">Open settings</button>
    <p class="bc-note">Private by design — nothing leaves your browser.</p>

    <script src="../shared/defaults.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
