<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Better Canvas</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="bc-pop-header">
      <span class="bc-pop-logo">BC</span>
      <div class="bc-pop-title">
        <h1>Better Canvas</h1>
        <p class="bc-ver"></p>
      </div>
      <label class="bc-master" title="Enable Better Canvas">
        <input type="checkbox" id="enabled" class="bc-sr-only" />
        <span id="master-label">On</span>
      </label>
    </header>

    <div id="site-status" class="bc-site"></div>

    <!-- Three switches and a menu, each led by the same drawn mark the settings
         panel uses for it, so the popup reads as the same product rather than as
         a second, plainer one. -->
    <div class="bc-card">
      <label class="bc-row" data-icon="moon">
        <span class="bc-row-label">Dark mode</span>
        <select id="darkMode" class="bc-select">
          <option value="off">Off</option>
          <option value="on">On</option>
          <option value="auto">Match system</option>
          <option value="scheduled">Scheduled</option>
        </select>
      </label>

      <label class="bc-row" data-icon="grid">
        <span class="bc-row-label">Dashboard</span>
        <span class="bc-switch"><input type="checkbox" id="dashEnabled" /><span class="bc-switch-thumb"></span></span>
      </label>

      <label class="bc-row" data-icon="bell">
        <span class="bc-row-label">In-page reminders</span>
        <span class="bc-switch"><input type="checkbox" id="notifsIn" /><span class="bc-switch-thumb"></span></span>
      </label>
    </div>

    <div class="bc-actions">
      <button id="open-options" class="bc-btn bc-btn--primary" data-icon="settings">All settings</button>
      <button id="open-palette" class="bc-btn bc-btn--icon" data-icon="search" title="Command palette — ⌘K on Canvas" aria-label="Command palette"></button>
    </div>
    <p class="bc-note">Nothing leaves your browser.</p>

    <script src="../shared/defaults.js"></script>
    <script src="../shared/themes.js"></script>
    <script src="../shared/icons.js"></script>
    <script src="../content/core/util.js"></script>
    <!-- isDarkActive() needs BC.dt to evaluate a scheduled dark window; without
         it the popup silently reported "not dark" and rendered light while the
         Canvas page next to it was dark. -->
    <script src="../content/core/datetime.js"></script>
    <script src="../content/core/color.js"></script>
    <script src="../shared/tokens.js"></script>
    <script src="../shared/skins.js"></script>
    <script src="../shared/skin-catalog.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
