<!doctype html>
<!--
  The popup's controls, clicked. Its render path was verified by screenshot but
  never exercised: paintMaster, the three switches and the dark-mode select all
  write through one stubbed chrome.storage, so this records what each click
  actually persisted and prints it where a screenshot can read it.
-->
<meta charset=utf-8><title>popup actions</title>
<body style="margin:0;font:13px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap;padding:12px">
<pre id=out>running…</pre>
<iframe id=f style="width:340px;height:430px;border:1px solid #ccc"></iframe>
<script>
const STUB = `<script>
window.__writes = [];
window.chrome = {
  storage: { local: { get: (k, cb) => cb({}),
                      set: (o, cb) => { window.__writes.push(JSON.parse(JSON.stringify(o))); cb && cb(); } },
             onChanged: { addListener(){}, removeListener(){} } },
  tabs: { query: () => Promise.resolve([{ id: 1, url: "https://school.instructure.com/" }]),
          sendMessage: (i, m, cb) => cb && cb({ canvas: true }), reload(){} },
  permissions: { contains: (o, cb) => cb(true), request: (o, cb) => cb(true) },
  runtime: { lastError: null, openOptionsPage(){}, sendMessage(){} },
};
<\/script>`;
(async () => {
  const html = await (await fetch("/src/popup/popup.html?t=" + Date.now())).text();
  const f = document.getElementById("f");
  f.srcdoc = html.replace("<head>", '<head><base href="/src/popup/">' + STUB);
  f.onload = () => setTimeout(() => {
    const w = f.contentWindow, d = f.contentDocument, log = [];
    const last = (path) => {
      const wr = w.__writes[w.__writes.length - 1];
      return wr ? path.split(".").reduce((o, k) => (o == null ? o : o[k]), wr.bcSettings) : "(no write)";
    };
    const pill = d.querySelector(".bc-master");
    log.push("master label at rest   " + d.getElementById("master-label").textContent +
             "  pillOn=" + pill.classList.contains("bc-on"));
    d.getElementById("enabled").click();
    log.push("after master click     stored enabled=" + last("enabled") +
             "  label=" + d.getElementById("master-label").textContent +
             "  pillOn=" + pill.classList.contains("bc-on"));
    const sel = d.getElementById("darkMode");
    sel.value = "auto"; sel.dispatchEvent(new Event("change", { bubbles: true }));
    log.push("after dark=auto        stored darkMode=" + last("theming.darkMode"));
    d.getElementById("dashEnabled").click();
    log.push("after dashboard click  stored dashboard.enabled=" + last("dashboard.enabled"));
    d.getElementById("notifsIn").click();
    log.push("after reminders click  stored notifications.inPage=" + last("notifications.inPage"));
    log.push("row marks drawn        " + d.querySelectorAll(".bc-row .bc-pop-ic svg").length + " of 3");
    log.push("button marks drawn     " + d.querySelectorAll(".bc-btn .bc-btn-ic svg").length + " of 2");
    log.push("writes recorded        " + w.__writes.length);
    document.getElementById("out").textContent = log.join("\n");
    document.title = "ready";
  }, 400);
})();
</script>
