<!doctype html>
<!--
  Feature check, synchronous so a load-time screenshot catches it. The extension
  ships a Firefox manifest but the panel was only ever rendered in Blink, and it
  leans on a handful of things Gecko and WebKit implement on their own schedule.
  Anything that reports NO here is a real hole in one of the shipped targets.
-->
<meta charset=utf-8><title>support</title>
<style>
  body { margin: 0; padding: 20px; font: 14px/1.6 ui-monospace, Menlo, monospace; }
  .no { color: #b91c1c; font-weight: 700; }
  .yes { color: #047857; }
  /* A miniature of the real row, so the answer is measured and not just claimed
     supported: three tracks, a container query that stacks them, and a select
     capped in absolute units so it cannot starve the label. */
  #probe { container-type: inline-size; container-name: bc-body; width: 300px; }
  .row { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 10px; align-items: center; }
  .row > b { min-width: 0; }
  select { max-width: 190px; }
  @container bc-body (max-width: 380px) {
    .row:not(.slim) { grid-template-columns: 28px minmax(0,1fr); row-gap: 8px; }
    .row:not(.slim) > select { grid-column: 2 / -1; justify-self: start; }
  }
  .sw:has(input:checked) { outline: 2px solid green; }
</style>
<body>
<div id=probe>
  <div class="row" id=r1><i>ic</i><b id=lab>Course card colour</b><select id=sel><option>Use the skin's colours</option></select></div>
  <div class="row slim" id=r2><i>ic</i><b>Toggle</b><span class="sw"><input type=checkbox checked></span></div>
  <div class="row" id=r3><i>ic</i><b id=lab2>Inert test</b><span id=inertbox inert><button id=inertbtn>x</button></span></div>
</div>
<pre id=out></pre>
<script>
const q = [
  ["container queries",      "container-type: inline-size"],
  [":has()",                 "selector(:has(input))"],
  ["color-mix()",            "color: color-mix(in srgb, red 50%, transparent)"],
  ["ui-rounded font",        "font-family: ui-rounded"],
  ["text-wrap: pretty",      "text-wrap: pretty"],
  ["backdrop-filter",        "backdrop-filter: blur(10px)"],
  ["inert attribute",        null],
];
const lines = q.map(([name, decl]) => {
  let ok;
  if (decl === null) ok = "inert" in HTMLElement.prototype;
  else if (decl.startsWith("selector(")) ok = CSS.supports(decl);
  else { const [p, ...v] = decl.split(":"); ok = CSS.supports(p.trim(), v.join(":").trim()); }
  return (ok ? "  yes  " : "  NO   ") + name;
});
// Measured, not claimed: does the label actually keep its width, and does the
// container query actually stack the non-slim row?
const lab = document.getElementById("lab");
const sel = document.getElementById("sel");
const r2b = document.getElementById("r2").querySelector("b");
const stacked = sel.getBoundingClientRect().top >= lab.getBoundingClientRect().bottom;
const slimInline = document.getElementById("r2").querySelector(".sw")
  .getBoundingClientRect().top < r2b.getBoundingClientRect().bottom;
const btn = document.getElementById("inertbtn");
lines.push("");
lines.push("  label width          " + Math.round(lab.getBoundingClientRect().width) + "px  (starved below ~120)");
lines.push("  wide row stacked     " + stacked);
lines.push("  slim row inline      " + slimInline);
lines.push("  inert blocks focus   " + (document.activeElement !== btn));
document.getElementById("out").textContent = lines.join("\n");
btn.focus();
document.getElementById("out").textContent += "\n  inert after focus()  " + (document.activeElement !== btn);
</script>
